<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Personal QR card"><meta name="theme-color" content="#080a0f">
<title>Your Name • Personal QR</title><link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page"><section class="card">
<header><span class="dot"></span><span>PERSONAL QR</span></header>
<div class="content">
<div class="copy">
<p class="eyebrow">SCAN • CONNECT • SAVE</p>
<h1>Your Name</h1>
<p class="role">Personal contact & quick-access card</p>
<p class="intro">Scan the QR code to open my personal link, contact details, profile, portfolio, or anything else I choose.</p>
<div class="actions"><a class="btn primary" href="#qr">View QR</a><button class="btn secondary" id="shareBtn">Share</button></div>
</div>
<div class="qr-panel" id="qr">
<div class="qr-frame"><img src="qr.png" alt="Personal QR code"></div>
<strong>Scan to connect</strong><small>Replace only <code>qr.png</code> when you want a new QR.</small>
</div>
</div>
<footer>© <span id="year"></span> Your Name <i>•</i> Made for GitHub Pages</footer>
</section></main>
<div class="toast" id="toast"></div><script src="script.js"></script>
</body></html>
